# Accepted RustSec findings (CI-SPEC CI-13 / CI-D12). None is a vulnerability:
# `npm audit` and `cargo audit` both report 0 vulnerabilities. Each entry is a
# warning pulled in by Tauri 2.11.5, not by lokey's own code. Revisit every
# entry by its expiry date, or sooner when a Tauri update drops the crate.
# Accepted 2026-09-19. Expiry for all entries: 2026-12-19.

[advisories]
ignore = [
  # glib 0.18.5, unsound VariantStrIter iterator impls. Linux GTK stack only
  # (tauri -> wry/gtk); it is never compiled into the Windows build.
  "RUSTSEC-2024-0429",
  # proc-macro-error 1.0.4, unmaintained. Compile-time macro dependency of the
  # Linux GTK bindings; runs only while building, never ships.
  "RUSTSEC-2024-0370",
  # unic-* 0.9.0, unmaintained Unicode tables used by tauri-utils' URL pattern
  # matching. Unmaintained, not vulnerable; no replacement is available to us
  # until Tauri moves off them.
  "RUSTSEC-2025-0075",
  "RUSTSEC-2025-0080",
  "RUSTSEC-2025-0081",
  "RUSTSEC-2025-0098",
  "RUSTSEC-2025-0100",
]
