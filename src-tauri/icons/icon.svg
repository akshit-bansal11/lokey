<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3393ff"/>
      <stop offset="1" stop-color="#0049b8"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy="0" r=".9">
      <stop offset="0" stop-color="#fff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#00275f" flood-opacity=".35"/>
    </filter>
    <mask id="cut">
      <rect width="1024" height="1024" fill="#fff"/>
      <circle cx="446" cy="334" r="21" fill="#000"/>
      <circle cx="512" cy="318" r="21" fill="#000"/>
      <circle cx="578" cy="334" r="21" fill="#000"/>
      <circle cx="512" cy="590" r="54" fill="#000"/>
      <path d="M488 618 H536 L558 728 Q560 740 548 740 H476 Q464 740 466 728 Z" fill="#000"/>
    </mask>
  </defs>
  <rect x="48" y="48" width="928" height="928" rx="212" fill="url(#tile)"/>
  <rect x="48" y="48" width="928" height="928" rx="212" fill="url(#glow)"/>
  <!-- salt: three cubic grains falling from the cap -->
  <g fill="#fff">
    <rect x="-15" y="-15" width="30" height="30" rx="5" transform="translate(724 262) rotate(18)" opacity=".95"/>
    <rect x="-11" y="-11" width="22" height="22" rx="4" transform="translate(770 330) rotate(-14)" opacity=".75"/>
    <rect x="-8" y="-8" width="16" height="16" rx="3" transform="translate(744 196) rotate(32)" opacity=".55"/>
  </g>
  <g fill="#fff" mask="url(#cut)" filter="url(#shadow)">
    <!-- cap -->
    <path d="M354 420 V356 C354 294 426 254 512 254 C598 254 670 294 670 356 V420 Z"/>
    <!-- body: tapers out toward the base, like a shaker -->
    <path d="M388 446 H636 Q700 446 704 510 L716 742 Q720 806 656 806 H368 Q304 806 308 742 L320 510 Q324 446 388 446 Z"/>
  </g>
</svg>
