[package]
name = "lokey-app"
description = "lokey desktop app: the vault as a table"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# The binary is `lokey.exe`, not `lokey-app.exe`: the app is the whole product.
[[bin]]
name = "lokey"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
lokey-core.workspace = true
serde.workspace = true
tauri = { version = "2.11.5", features = [] }

# The Save and Open dialogs for backups (file_dialog.rs). Already a
# dependency of lokey-core; no new crate enters the build.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_UI_Controls_Dialogs"] }

[lints]
workspace = true
