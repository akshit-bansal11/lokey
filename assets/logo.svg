<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <title>Saltcellar</title>
  <!-- a hopper crystal: rock salt grows in stepped, sinking squares, like stairs down to a cellar -->
  <rect width="1024" height="1024" rx="228" fill="#F6C24B"/>
  <rect x="112" y="112" width="800" height="800" rx="160" fill="#E39B29"/>
  <rect x="212" y="252" width="600" height="600" rx="120" fill="#AE6519"/>
  <rect x="302" y="382" width="420" height="420" rx="84" fill="#5C3412"/>
  <rect x="382" y="502" width="260" height="260" rx="52" fill="#1B120B"/>
  <!-- the keyhole, at the bottom of the steps -->
  <circle cx="512" cy="601" r="56" fill="#F6C24B"/>
  <path d="M488 626 H536 L554 719 H470 Z" fill="#F6C24B"/>
</svg>
