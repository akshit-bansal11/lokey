[workspace]
resolver = "3"
members = ["crates/lokey-core", "src-tauri"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/akshit-bansal11/lokey"

[workspace.dependencies]
lokey-core = { path = "crates/lokey-core" }
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc", "zeroize"] }
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
base64 = "0.23.1"
getrandom = "0.4.3"
hpke = { version = "0.14.1", default-features = false, features = ["alloc", "getrandom", "x25519", "aes"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
] }
zeroize = { version = "1.9.0", features = ["derive"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

# Argon2id at 64 MiB is the deliberate cost of every unlock. Unoptimised it
# takes seconds, which would make `cargo test` crawl, so dependencies are always
# built optimised. This changes build speed only, never the KDF parameters.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
strip = true
