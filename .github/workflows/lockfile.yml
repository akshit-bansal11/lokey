# Resolves Cargo.lock on a runner. The maintainer's machine has no Rust
# toolchain, so any change to a Cargo.toml is followed by running this on the
# branch and committing the uploaded Cargo.lock.
name: lockfile
on: workflow_dispatch
permissions:
  contents: read
jobs:
  lock:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch, 2026-09-27
        with:
          toolchain: stable
      - run: cargo update --workspace
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Cargo.lock
          path: Cargo.lock
