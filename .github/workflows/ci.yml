name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly: advisories and secret history, even without pushes

permissions:
  contents: read

jobs:
  gate:
    name: gate (lint, types, tests)
    # Windows, because the clipboard code only compiles there and must be linted.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.2
      - run: npm ci
      - run: npm run check:ci

  build:
    name: build the Windows app
    needs: gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
      - run: npm ci
      # --no-bundle: the release is one portable exe, so no installer is built.
      - run: npx tauri build --ci --no-bundle
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: lokey-windows-x64
          retention-days: 14
          if-no-files-found: error
          path: target/release/lokey.exe

  audit:
    name: dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
      - run: npm audit --audit-level=high
      - uses: taiki-e/install-action@v2.87.19
        with:
          tool: cargo-audit
      - run: cargo audit --deny warnings

  secrets:
    name: secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        env:
          VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" | tar xz gitleaks
          ./gitleaks git --redact --verbose --log-opts="--all" .
