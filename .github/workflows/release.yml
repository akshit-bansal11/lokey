# Builds and publishes a release when a version tag is pushed (v0.4.0, ...).
# Separate from ci.yml on purpose: a green build never implies a release.
#
# Three jobs: version reads and checks the version; build compiles each platform with a read-only token; publish, the only job with write permissions, runs no npm or cargo and only names, sums, attests and releases the files the builds uploaded.
#
# The release carries Saltcellar-<version>.exe (Windows, portable), Saltcellar-<version>-macos-universal.dmg, Saltcellar-<version>-linux-x86_64.AppImage and Saltcellar-<version>-linux-amd64.deb, plus SHA256SUMS.txt and a build provenance attestation.
# That gave up the permanent releases/latest/download link, which
# the README no longer uses.
#
# Running this by hand instead builds the same files from whatever the branch
# holds and attaches them to a DRAFT release. A draft is visible only to accounts
# with push access, and GitHub does not create its git tag until it is
# published, so nothing reaches the public: no tag, no entry on the releases
# page, and releases/latest keeps pointing at the last real release. That is
# how a build gets onto the owner's PC for testing (an upgrade from lokey, say)
# without announcing a version.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      label:
        description: "Name for the draft build (the run number is appended, so it never collides)"
        default: "test-build"
        required: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The app reports the version in tauri.conf.json. A tagged run must match
      # it in all three version files. A hand-run draft has no tag, so it is
      # named for that version plus the run number, which keeps two drafts of
      # the same version apart once they are on the PC.
      - name: Version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("${{ github.event_name }}" -eq "push") {
            $tag = "${{ github.ref_name }}".TrimStart('v')
            if ($tag -ne $version) { throw "tag v$tag does not match version $version in tauri.conf.json" }
            $cargo = [regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version = "([^"]+)"').Groups[1].Value
            if ($tag -ne $cargo) { throw "tag v$tag does not match version $cargo in Cargo.toml" }
            $npm = (Get-Content package.json -Raw | ConvertFrom-Json).version
            if ($tag -ne $npm) { throw "tag v$tag does not match version $npm in package.json" }
            $name = $version
          } else {
            $name = "$version-draft.${{ github.run_number }}"
          }
          "version=$name" >> $env:GITHUB_OUTPUT

  build:
    needs: version
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            args: --no-bundle
          - name: macos
            os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
          - name: linux
            os: ubuntu-22.04
            args: --bundles appimage,deb
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev
      # No cache: a release build never restores one another branch could have written.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch, 2026-09-27
        with:
          toolchain: stable
          components: rustfmt, clippy
      - if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: npm ci
      # The release is built only from a commit that passes the full gate.
      - run: npm run check:ci
      - run: npx tauri build --ci ${{ matrix.args }} -- --locked

      # The build keeps the plain name; the version goes on here, once, for
      # both paths. publish takes the sums after this, so SHA256SUMS.txt
      # names each file exactly as it is downloaded.
      - name: Name the files for the version
        shell: bash
        run: |
          # Not dist/: Vite builds the page there, and its files would be uploaded and released too.
          mkdir -p release
          case "${{ matrix.name }}" in
            windows) cp target/release/saltcellar.exe "release/Saltcellar-$VERSION.exe" ;;
            macos) cp target/universal-apple-darwin/release/bundle/dmg/*.dmg "release/Saltcellar-$VERSION-macos-universal.dmg" ;;
            linux)
              cp target/release/bundle/appimage/*.AppImage "release/Saltcellar-$VERSION-linux-x86_64.AppImage"
              cp target/release/bundle/deb/*.deb "release/Saltcellar-$VERSION-linux-amd64.deb"
              ;;
          esac
          ls -l release

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.name }}
          path: release/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # sign the build attestation
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      # Only for CHANGELOG.md; nothing from the repo is built or run here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: release

      - name: Sum the files
        shell: bash
        run: cd release && sha256sum Saltcellar-* > SHA256SUMS.txt && cat SHA256SUMS.txt

      # A tagged run takes that version's section of CHANGELOG.md. A hand-run
      # draft takes Unreleased, since it is a build of work in progress; when
      # that is empty, as it is between the version bump and the tag, it takes
      # the section of the version in tauri.conf.json.
      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $text = Get-Content CHANGELOG.md -Raw
          function Notes([string] $section) {
            $match = [regex]::Match($text, "(?ms)^## \[$([regex]::Escape($section))\][^\n]*\n(.*?)(?=^## \[|^\[[^\]]+\]: |\z)")
            $match.Groups[1].Value.Trim()
          }
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("${{ github.event_name }}" -eq "push") {
            $section = "${{ github.ref_name }}".TrimStart('v')
            $notes = Notes $section
          } else {
            $section = "Unreleased"
            $notes = Notes $section
            if (-not $notes) { $section = $version; $notes = Notes $section }
          }
          if (-not $notes) { throw "CHANGELOG.md has no notes for $section" }
          $notes | Set-Content -Encoding utf8 notes.md

      # Provenance per SLSA v1.1 (CI-SPEC CI-19). Verify with:
      #   gh attestation verify Saltcellar-<version>.exe --repo akshit-bansal11/saltcellar
      # Tagged releases only: an attestation of a public repository is written
      # to Sigstore's public transparency log, which would announce a draft.
      - name: Attest where the files were built
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/Saltcellar-*

      - name: Publish the release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$env:GITHUB_REF_NAME" release/*
          --repo "$env:GITHUB_REPOSITORY" --title "Saltcellar $env:GITHUB_REF_NAME" --notes-file notes.md --verify-tag

      # --draft is what keeps this private, and the run number keeps two test
      # builds from colliding on a name: deleting a release is an owner action,
      # so a job must never need one deleted to succeed. --target pins the
      # draft to this commit; its tag is only cut if it is ever published.
      - name: Attach the draft build
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ inputs.label }}-${{ github.run_number }}
        run: |
          gh release create "$env:NAME" release/* --repo "$env:GITHUB_REPOSITORY" --title "Saltcellar $env:NAME" --notes-file notes.md --draft --target "$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @(
            "Draft build **$env:NAME**, visible only to accounts with push access to this repo."
            ""
            "Download the files with SHA256SUMS.txt:"
            '```'
            "gh release download $env:NAME --repo $env:GITHUB_REPOSITORY --dir ."
            '```'
          ) | Add-Content $env:GITHUB_STEP_SUMMARY
