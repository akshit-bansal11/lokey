# Builds and publishes a release when a version tag is pushed (v0.1.0, ...).
# Separate from ci.yml on purpose: a green build never implies a release.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # sign the build attestation
      attestations: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Tag matches the version the binaries report
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $version) { throw "tag v$tag does not match version $version in tauri.conf.json" }
          $cargo = [regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version = "([^"]+)"').Groups[1].Value
          if ($tag -ne $cargo) { throw "tag v$tag does not match version $cargo in Cargo.toml" }
      - run: npm ci
      # The release is built only from a commit that passes the full gate.
      - run: npm run check:ci
      - run: npx tauri build --ci -- --locked
      - run: cargo build --release --locked -p lokey-cli

      - name: Collect release files
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item target/release/lokey.exe out/lokey.exe
          Copy-Item target/release/lokey-app.exe out/lokey-app.exe
          Copy-Item (Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1).FullName "out/lokey_${version}_x64-setup.exe"
          Copy-Item scripts/install.ps1 out/install.ps1
          Get-ChildItem out -File | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content -Encoding ascii out/SHA256SUMS.txt
          Get-Content out/SHA256SUMS.txt

      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $text = Get-Content CHANGELOG.md -Raw
          $match = [regex]::Match($text, "(?ms)^## \[$([regex]::Escape($version))\][^\n]*\n(.*?)(?=^## \[|^\[[^\]]+\]: |\z)")
          if (-not $match.Success) { throw "CHANGELOG.md has no section for $version" }
          $match.Groups[1].Value.Trim() | Set-Content -Encoding utf8 notes.md

      # Provenance per SLSA v1.1 (CI-SPEC CI-19). Verify with:
      #   gh attestation verify lokey.exe --repo akshit-bansal11/lokey
      - uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: out/*.exe

      - uses: softprops/action-gh-release@v3.0.3
        with:
          body_path: notes.md
          files: out/*
          fail_on_unmatched_files: true
