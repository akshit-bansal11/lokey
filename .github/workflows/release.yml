# Builds and publishes a release when a version tag is pushed (v0.1.0, ...).
# Separate from ci.yml on purpose: a green build never implies a release.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # sign the build attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch, 2026-09-27
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Tag matches the version the binaries report
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $version) { throw "tag v$tag does not match version $version in tauri.conf.json" }
          $cargo = [regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version = "([^"]+)"').Groups[1].Value
          if ($tag -ne $cargo) { throw "tag v$tag does not match version $cargo in Cargo.toml" }
      - run: npm ci
      # The release is built only from a commit that passes the full gate.
      - run: npm run check:ci
      # --no-bundle: the release is one portable exe, so no installer is built.
      - run: npx tauri build --ci --no-bundle -- --locked

      - name: Collect release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item target/release/lokey.exe out/lokey.exe
          $sums = Get-ChildItem out -File | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          }
          # LF endings: Set-Content writes CRLF, which breaks `sha256sum -c`.
          [IO.File]::WriteAllText("$PWD/out/SHA256SUMS.txt", ($sums -join "`n") + "`n")
          Get-Content out/SHA256SUMS.txt

      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $text = Get-Content CHANGELOG.md -Raw
          $match = [regex]::Match($text, "(?ms)^## \[$([regex]::Escape($version))\][^\n]*\n(.*?)(?=^## \[|^\[[^\]]+\]: |\z)")
          if (-not $match.Success) { throw "CHANGELOG.md has no section for $version" }
          $match.Groups[1].Value.Trim() | Set-Content -Encoding utf8 notes.md

      # Provenance per SLSA v1.1 (CI-SPEC CI-19). Verify with:
      #   gh attestation verify lokey.exe --repo akshit-bansal11/lokey
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/*.exe

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: notes.md
          files: out/*
          fail_on_unmatched_files: true
