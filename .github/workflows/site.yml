name: Site

# The website is its own gate, on its own trigger: it runs only when the site changes.
# The app's gate (ci.yml) never looks at site/, and this one never looks at the app.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'vercel.json'
      - '.github/workflows/site.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'vercel.json'
      - '.github/workflows/site.yml'

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        working-directory: site
        run: npm ci

      # Biome (format, import order, lint) -> ESLint (React, Next) -> tsc.
      # The non-mutating mode, so a branch is never quietly reformatted.
      - name: Quality gate
        working-directory: site
        run: npm run check:ci

      - name: Build
        working-directory: site
        run: npm run build
