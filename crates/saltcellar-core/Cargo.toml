[package]
name = "saltcellar-core"
description = "Vault engine behind the Saltcellar desktop app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
aes-gcm.workspace = true
argon2.workspace = true
base64.workspace = true
getrandom.workspace = true
hpke.workspace = true
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

# Copying on macOS and Linux (clipboard.rs). Windows keeps its own code, which also
# sets the formats that keep a copy out of Win+V history and cloud clipboard.
[target.'cfg(not(windows))'.dependencies]
arboard.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { workspace = true, features = ["wayland-data-control"] }

[lints]
workspace = true
